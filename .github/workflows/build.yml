name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # No database is available in this job, and the app's build doesn't
      # need one — see next.config.js for why this is safe.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build
